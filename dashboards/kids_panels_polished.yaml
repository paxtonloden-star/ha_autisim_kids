title: Kids Panels
views:
  - title: Feelings Panel
    path: feelings-panel
    icon: mdi:emoticon-happy-outline
    type: panel
    cards:
      - type: vertical-stack
        cards:
          - type: markdown
            content: |
              # How Do I Feel?
              ## **{{ states('sensor.kid_feeling') }}**
              **Intensity:** {{ states('number.feeling_intensity') }}
          - type: grid
            columns: 3
            square: false
            cards:
              - type: tile
                entity: button.feel_happy
                name: Happy
                color: yellow
              - type: tile
                entity: button.feel_sad
                name: Sad
                color: blue
              - type: tile
                entity: button.feel_mad
                name: Mad
                color: red
              - type: tile
                entity: button.feel_worried
                name: Worried
                color: orange
              - type: tile
                entity: button.feel_tired
                name: Tired
                color: grey
              - type: tile
                entity: button.feel_overwhelmed
                name: Overwhelmed
                color: deep-orange
              - type: tile
                entity: button.feel_excited
                name: Excited
                color: green
              - type: tile
                entity: select.feeling_select
                name: Choose Feeling
              - type: tile
                entity: number.feeling_intensity
                name: Intensity
  - title: Request Panel
    path: request-panel
    icon: mdi:gesture-tap-button
    type: panel
    cards:
      - type: vertical-stack
        cards:
          - type: markdown
            content: |
              # I Need...
              **Last Request:** {{ states('sensor.kid_last_request') }}
              **Time:** {{ states('sensor.kid_last_request_time') }}
          - type: grid
            columns: 3
            square: false
            cards:
              - type: tile
                entity: button.request_help
                name: Help
                color: red
              - type: tile
                entity: button.request_drink
                name: Drink
                color: blue
              - type: tile
                entity: button.request_snack
                name: Snack
                color: amber
              - type: tile
                entity: button.request_bathroom
                name: Bathroom
                color: cyan
              - type: tile
                entity: button.request_break
                name: Break
                color: green
              - type: tile
                entity: button.request_quiet
                name: Quiet
                color: purple
              - type: tile
                entity: button.request_hug
                name: Hug
                color: pink
              - type: tile
                entity: button.request_too_loud
                name: Too Loud
                color: deep-orange
              - type: tile
                entity: button.request_all_done
                name: All Done
                color: teal
