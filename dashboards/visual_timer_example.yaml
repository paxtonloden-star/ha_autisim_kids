title: Timer
path: timer
icon: mdi:timer-outline
cards:
  - type: markdown
    content: |
      # Timer
      **Label:** {{ states('sensor.kid_timer_label') }}
      **Status:** {{ states('sensor.kid_timer_status') }}
      **Remaining:** {{ states('sensor.kid_timer_remaining') }}

  - type: grid
    columns: 3
    square: false
    cards:
      - type: tile
        entity: button.start_2_minute_timer
        name: 2 Min
      - type: tile
        entity: button.start_5_minute_timer
        name: 5 Min
      - type: tile
        entity: button.start_10_minute_timer
        name: 10 Min
      - type: tile
        entity: button.start_custom_timer
        name: Start Custom
      - type: tile
        entity: button.pause_timer
        name: Pause
      - type: tile
        entity: button.resume_timer
        name: Resume
      - type: tile
        entity: button.cancel_timer
        name: Cancel
      - type: tile
        entity: number.custom_timer_minutes
        name: Custom Minutes

  - type: gauge
    entity: sensor.kid_timer_remaining_seconds
    name: Time Left
    min: 0
    max: 600
