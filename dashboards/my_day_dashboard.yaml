title: My Day
path: my-day
icon: mdi:home-heart
cards:
  - type: markdown
    content: |
      # My Day
      ## Now: **{{ states('sensor.kid_now_activity') }}**
      ### Next: **{{ states('sensor.kid_next_activity') }}**
      ### Later: **{{ states('sensor.kid_later_activity') }}**

  - type: grid
    columns: 2
    square: false
    cards:
      - type: tile
        entity: sensor.kid_who_is_home
        name: Who is home
        vertical: false
      - type: tile
        entity: sensor.kid_special_change_summary
        name: Special change
        vertical: false
      - type: tile
        entity: sensor.kid_dinner_summary
        name: Dinner
        vertical: false
      - type: tile
        entity: sensor.kid_bedtime_summary
        name: Bedtime
        vertical: false
      - type: tile
        entity: sensor.kid_school_tomorrow_summary
        name: Tomorrow
        vertical: false
      - type: tile
        entity: sensor.kid_weather_summary
        name: Weather
        vertical: false

  - type: markdown
    content: |
      {% if states('sensor.kid_special_change_summary') != 'No special changes today' %}
      # Today is different
      **{{ states('sensor.kid_special_change_summary') }}**
      {% else %}
      # Today looks normal
      {% endif %}
