title: Classic Theme
views:
  - title: Home
    path: classic-home
    theme: autism_kids_classic
    cards:
      - type: markdown
        content: |
          # My Day
          **Now:** {{ states('sensor.kid_now_activity') }}
          **Next:** {{ states('sensor.kid_next_activity') }}
          **Later:** {{ states('sensor.kid_later_activity') }}
      - type: grid
        columns: 2
        square: false
        cards:
          - type: button
            entity: button.request_help
            name: Help
            color: red
            tap_action:
              action: toggle
          - type: button
            entity: button.request_break
            name: Break
            color: green
            tap_action:
              action: toggle
          - type: button
            entity: button.feel_happy
            name: Happy
            color: yellow
            tap_action:
              action: toggle
          - type: button
            entity: button.feel_sad
            name: Sad
            color: blue
            tap_action:
              action: toggle
