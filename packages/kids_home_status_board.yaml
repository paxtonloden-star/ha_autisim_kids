input_text:
  kid_special_change_text:
    name: Kid Special Change Text
    max: 255
  kid_dinner_text:
    name: Kid Dinner Text
    max: 100
  kid_now_fallback:
    name: Kid Now Fallback
    max: 100
    initial: Free Time
  kid_next_fallback:
    name: Kid Next Fallback
    max: 100
    initial: Check Board
  kid_later_fallback:
    name: Kid Later Fallback
    max: 100
    initial: Dinner

input_boolean:
  kid_school_tomorrow:
    name: Kid School Tomorrow
    initial: true

input_datetime:
  kid_bedtime:
    name: Kid Bedtime
    has_date: false
    has_time: true

template:
  - trigger:
      - platform: time_pattern
        minutes: "/5"
      - platform: homeassistant
        event: start
      - platform: state
        entity_id:
          - calendar.kid_schedule
          - calendar.family
          - person.mom
          - person.dad
          - input_text.kid_special_change_text
          - input_text.kid_dinner_text
          - input_boolean.kid_school_tomorrow
          - input_datetime.kid_bedtime
          - weather.home
    sensor:
      - name: Kid Now Activity
        unique_id: kid_now_activity
        icon: mdi:play-circle
        state: >-
          {% set msg = state_attr('calendar.kid_schedule', 'message') %}
          {% set active = is_state('calendar.kid_schedule', 'on') %}
          {% if active and msg %}
            {{ msg }}
          {% else %}
            {{ states('input_text.kid_now_fallback') }}
          {% endif %}

      - name: Kid Next Activity
        unique_id: kid_next_activity
        icon: mdi:skip-next-circle
        state: >-
          {% set message = state_attr('calendar.family', 'message') %}
          {% set start_time = state_attr('calendar.family', 'start_time') %}
          {% if message and start_time %}
            {{ message }}
          {% else %}
            {{ states('input_text.kid_next_fallback') }}
          {% endif %}
        attributes:
          start_time: "{{ state_attr('calendar.family', 'start_time') }}"

      - name: Kid Later Activity
        unique_id: kid_later_activity
        icon: mdi:timeline-clock
        state: >-
          {{ states('input_text.kid_later_fallback') }}

      - name: Kid Who Is Home
        unique_id: kid_who_is_home
        icon: mdi:home-account
        state: >-
          {% set names = [] %}
          {% if is_state('person.mom', 'home') %}
            {% set names = names + ['Mom'] %}
          {% endif %}
          {% if is_state('person.dad', 'home') %}
            {% set names = names + ['Dad'] %}
          {% endif %}
          {% if names | count == 0 %}
            No one is home
          {% elif names | count == 1 %}
            {{ names[0] }} is home
          {% elif names | count == 2 %}
            {{ names[0] }} and {{ names[1] }} are home
          {% else %}
            {{ names | join(', ') }} are home
          {% endif %}

      - name: Kid Special Change Summary
        unique_id: kid_special_change_summary
        icon: mdi:calendar-alert
        state: >-
          {% set txt = states('input_text.kid_special_change_text') %}
          {% if txt in ['unknown', 'unavailable', 'none', ''] %}
            No special changes today
          {% else %}
            {{ txt }}
          {% endif %}

      - name: Kid Dinner Summary
        unique_id: kid_dinner_summary
        icon: mdi:silverware-fork-knife
        state: >-
          {% set txt = states('input_text.kid_dinner_text') %}
          {% if txt in ['unknown', 'unavailable', 'none', ''] %}
            Dinner not set
          {% else %}
            {{ txt }}
          {% endif %}

      - name: Kid Bedtime Summary
        unique_id: kid_bedtime_summary
        icon: mdi:bed-clock
        state: >-
          {% set t = states('input_datetime.kid_bedtime') %}
          {% if t in ['unknown', 'unavailable', ''] %}
            Bedtime not set
          {% else %}
            Bedtime at {{ today_at(t).strftime('%-I:%M %p') }}
          {% endif %}

      - name: Kid School Tomorrow Summary
        unique_id: kid_school_tomorrow_summary
        icon: mdi:school
        state: >-
          {% if is_state('input_boolean.kid_school_tomorrow', 'on') %}
            School tomorrow
          {% else %}
            No school tomorrow
          {% endif %}

      - name: Kid Weather Summary
        unique_id: kid_weather_summary
        icon: mdi:weather-partly-cloudy
        state: >-
          {% set condition = states('weather.home') %}
          {% set temp = state_attr('weather.home', 'temperature') %}
          {% if condition in ['unknown', 'unavailable'] %}
            Weather unavailable
          {% elif temp is not none %}
            {{ condition | replace('_', ' ') | title }}, {{ temp }}°
          {% else %}
            {{ condition | replace('_', ' ') | title }}
          {% endif %}

automation:
  - id: kid_status_board_morning_refresh
    alias: Kid Status Board Morning Refresh
    mode: single
    trigger:
      - platform: time
        at: "06:00:00"
      - platform: homeassistant
        event: start
    action:
      - service: homeassistant.update_entity
        target:
          entity_id:
            - sensor.kid_now_activity
            - sensor.kid_next_activity
            - sensor.kid_later_activity
            - sensor.kid_who_is_home
            - sensor.kid_special_change_summary
            - sensor.kid_dinner_summary
            - sensor.kid_bedtime_summary
            - sensor.kid_school_tomorrow_summary
            - sensor.kid_weather_summary

  - id: kid_status_board_presence_refresh
    alias: Kid Status Board Presence Refresh
    mode: restart
    trigger:
      - platform: state
        entity_id:
          - person.mom
          - person.dad
    action:
      - service: homeassistant.update_entity
        target:
          entity_id: sensor.kid_who_is_home

  - id: kid_status_board_calendar_change_refresh
    alias: Kid Status Board Calendar Change Refresh
    mode: restart
    trigger:
      - platform: state
        entity_id:
          - calendar.kid_schedule
          - calendar.family
    action:
      - service: homeassistant.update_entity
        target:
          entity_id:
            - sensor.kid_now_activity
            - sensor.kid_next_activity

  - id: kid_status_board_defaults_morning
    alias: Kid Status Board Set Morning Defaults
    mode: single
    trigger:
      - platform: time
        at: "06:00:00"
    action:
      - service: input_text.set_value
        target:
          entity_id: input_text.kid_later_fallback
        data:
          value: "Dinner"
